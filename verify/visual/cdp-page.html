<!DOCTYPE html>
<!--
  verify/visual/cdp-page.html · **自造最小页面**（只为视觉门禁服务，不是交付物）
  ---------------------------------------------------------------------------
  用途：verify/visual/visual-gate.js 用它验证「冻结时钟 → CDP 抓图」这条链路本身。
    · 像素内容完全确定：同一个方块位置 → 同一个 canvas 像素（无随机、无时间依赖的渲染）；
    · 暴露与真实页面同形的只读出口 `window.__slingshotState`（getter: phase/atReady/square），
      让抓图函数用**同一套就绪判定与钉相位逻辑**跑自造页面 —— 链路修好了，换到真实页面才有意义。

  纪律：它不参与任何"好看/像不像"的判定；判定由 visual-gate.js 的确定性断言负责。
  故意【不】依赖 WebGL：画布用 2D 上下文，把不可控变量（GPU/驱动差异）挡在门禁之外。
-->
<meta charset="utf-8">
<title>visual fixture</title>
<style>
  html, body { margin: 0; padding: 0; background: #101418; width: 100%; height: 100%; overflow: hidden; }
  #app { position: absolute; inset: 0; }
  #app canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  #status { position: absolute; left: 12px; bottom: 10px; font: 13px/1.2 monospace; color: #eef1f6; }
</style>
<div id="app"><canvas id="stage"></canvas></div>
<div id="status">READY</div>
<script>
(function () {
  'use strict';
  var GAP = 20;                    // 方块半边长
  var SPEED = 110;                 // px/s（与真实页面同量级）
  var STEP = 1 / 120;              // 固定物理步长
  var HALF_W = 0, HALF_H = 0;
  var square = { x: 0, y: 0, dir: 1 };
  var acc = 0, last = performance.now();
  var cv = document.getElementById('stage');
  var ctx = cv.getContext('2d', { alpha: false });

  function layout() {
    var dpr = window.devicePixelRatio || 1;
    HALF_W = cv.clientWidth / 2;
    HALF_H = cv.clientHeight / 2;
    cv.width = Math.round(cv.clientWidth * dpr);
    cv.height = Math.round(cv.clientHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    square.y = 0;
  }
  function stepSquare(dt) {
    var lim = Math.max(0, HALF_W - GAP * 2);
    if (lim <= 0) { square.x = 0; return; }
    square.x += square.dir * SPEED * dt;
    if (square.x <= -lim) { square.x = -lim; square.dir = 1; }
    else if (square.x >= lim) { square.x = lim; square.dir = -1; }
  }
  function draw() {
    ctx.fillStyle = '#101418';
    ctx.fillRect(0, 0, cv.clientWidth, cv.clientHeight);
    /* 固定参照物：中轴线 + 十字，任何位移都会立刻体现在像素上 */
    ctx.strokeStyle = '#2a3441'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(HALF_W, 0); ctx.lineTo(HALF_W, cv.clientHeight);
    ctx.moveTo(0, HALF_H); ctx.lineTo(cv.clientWidth, HALF_H);
    ctx.stroke();
    /* 方块：位置由物理步决定，完全确定 */
    ctx.fillStyle = '#ffb020';
    ctx.fillRect(HALF_W + square.x - GAP, HALF_H + square.y - GAP, GAP * 2, GAP * 2);
  }
  function animate(now) {
    requestAnimationFrame(animate);
    var dt = (now - last) / 1000; last = now;
    if (!isFinite(dt) || dt <= 0) dt = STEP;
    dt = Math.min(dt, 0.05);
    acc += dt;
    while (acc >= STEP) { stepSquare(STEP); acc -= STEP; }
    draw();
  }
  window.addEventListener('resize', function () { layout(); draw(); });
  layout();
  window.__slingshotState = {
    get phase() { return 'ready'; },
    get atReady() { return true; },
    get square() { return { x: square.x, y: square.y, dir: square.dir, state: 'moving' }; }
  };
  draw();
  requestAnimationFrame(animate);
})();
</script>
